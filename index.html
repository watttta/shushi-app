<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>かんたん収支</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Roboto+Mono:wght@500;700&display=swap');
  :root{
    --ink:#1a2238; --soft:#6b7280; --line:#e6e8ef; --bg:#f4f5f9; --card:#fff;
    --sales:#c2410c; --sales-bg:#fff2ea; --cost:#1d4ed8; --cost-bg:#eef2ff;
    --ok:#15803d; --ok-bg:#e8f5ec;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{font-family:'Zen Kaku Gothic New',sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;display:flex;justify-content:center}
  .app{width:100%;max-width:390px;min-height:100vh;background:var(--bg);padding:0 0 40px}
  .mono{font-family:'Roboto Mono',monospace;font-feature-settings:"tnum"}

  header{background:var(--ink);color:#fff;padding:18px 20px 16px;text-align:center}
  header h1{font-size:17px;font-weight:900;letter-spacing:.03em}
  header p{font-size:11.5px;color:#9aa2b8;margin-top:2px}
  .pad{padding:0 14px}

  .target{background:var(--card);border-radius:16px;margin:14px 0;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 16px rgba(0,0,0,.05)}
  .target .lbl{font-size:13px;font-weight:700;color:var(--soft)}
  .target .ctl{display:flex;align-items:center;gap:8px}
  .step{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:24px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .step:active{transform:scale(.9);background:var(--bg)}
  .target .v{font-family:'Roboto Mono';font-size:28px;font-weight:700;min-width:84px;text-align:center}

  .card{background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
  .card h2{font-size:13px;font-weight:700;color:var(--soft);margin-bottom:6px}
  .colhead{display:grid;gap:6px;font-size:10.5px;color:var(--soft);font-weight:700;padding:2px 0}
  .colhead.sale{grid-template-columns:1fr 84px 64px 24px}
  .colhead.exp{grid-template-columns:1fr 104px 24px}
  .colhead.sale span:nth-child(2),.colhead.sale span:nth-child(3){text-align:center}
  .colhead.exp span:nth-child(2){text-align:center}
  .srow{display:grid;gap:6px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line)}
  .srow.sale{grid-template-columns:1fr 84px 64px 24px}
  .srow.exp{grid-template-columns:1fr 104px 24px}
  .srow:last-of-type{border-bottom:none}
  .nm{border:1px solid var(--line);border-radius:9px;padding:9px 9px;font-size:13.5px;width:100%;background:#fff;color:var(--ink);font-family:'Zen Kaku Gothic New'}
  .ipt{border:1px solid var(--line);border-radius:9px;padding:9px 8px;font-size:15px;font-family:'Roboto Mono';text-align:right;width:100%;background:#fff;color:var(--ink)}
  .nm:focus,.ipt:focus{outline:none;border-color:var(--sales);background:var(--sales-bg)}
  .exp .nm:focus,.exp .ipt:focus{border-color:var(--cost);background:var(--cost-bg)}
  .del{background:none;border:none;color:#cbd0db;font-size:18px;cursor:pointer;padding:0;text-align:center}
  .add{width:100%;margin-top:10px;padding:10px;border:1.5px dashed var(--line);border-radius:11px;background:transparent;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .add.sale{color:var(--sales)} .add.sale:active{background:var(--sales-bg)}
  .add.exp{color:var(--cost)} .add.exp:active{background:var(--cost-bg)}

  .line{display:flex;justify-content:space-between;align-items:center;padding:10px 0 2px;font-size:13px;border-top:1px dashed var(--line);margin-top:6px}
  .line .k{color:var(--soft);font-weight:500}
  .line .val{font-family:'Roboto Mono';font-weight:700;font-size:17px}

  .answers{display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
  .ans{border-radius:18px;padding:18px;color:#fff;position:relative;overflow:hidden}
  .ans.sales{background:linear-gradient(150deg,#c2410c,#9a3412)}
  .ans.cost{background:linear-gradient(150deg,#1d4ed8,#1e3a8a)}
  .ans .cap{font-size:12px;font-weight:700;opacity:.85}
  .ans .big{font-family:'Roboto Mono';font-size:32px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
  .ans .sub{font-size:12px;opacity:.85;margin-top:4px}
  .ans .tag{position:absolute;top:14px;right:16px;font-size:11px;font-weight:700;background:rgba(255,255,255,.18);padding:4px 9px;border-radius:20px}

  .now{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
  .now .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .now .top .t{font-size:13px;font-weight:700;color:var(--soft)}
  .now .badge{font-size:13px;font-weight:700;padding:5px 12px;border-radius:20px}
  .now .badge.ok{background:var(--ok-bg);color:var(--ok)}
  .now .badge.no{background:var(--sales-bg);color:var(--sales)}
  .now .badge.idle{background:var(--bg);color:var(--soft);font-weight:500}
  .now .stats{display:flex;gap:10px}
  .now .stat{flex:1;background:var(--bg);border-radius:12px;padding:10px 12px;text-align:center}
  .now .stat .k{font-size:11px;color:var(--soft);font-weight:700}
  .now .stat .n{font-family:'Roboto Mono';font-size:19px;font-weight:700;margin-top:2px}

  .foot{font-size:11px;color:#9aa2b8;text-align:center;margin-top:18px;line-height:1.6}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>かんたん収支</h1>
    <p>目標の利益率に合わせて、売上と経費の目安を出します</p>
  </header>

  <div class="pad">
    <div class="target">
      <span class="lbl">目標の利益率</span>
      <div class="ctl">
        <div class="step" id="down">−</div>
        <div class="v mono" id="tv">30%</div>
        <div class="step" id="up">＋</div>
      </div>
    </div>

    <div class="card">
      <h2>売上（参加費 × 人数）</h2>
      <div class="colhead sale"><span>区分</span><span>参加費</span><span>人数</span><span></span></div>
      <div id="salesList"></div>
      <button class="add sale" id="addSale">＋ 区分を追加</button>
      <div class="line"><span class="k">売上合計</span><span class="val mono" id="sales">0円</span></div>
      <div class="line" style="border:none;padding-top:2px"><span class="k">合計人数</span><span class="val mono" id="qtyTotal" style="font-size:14px">0人</span></div>
    </div>

    <div class="card">
      <h2>経費</h2>
      <div class="colhead exp"><span>項目</span><span>金額</span><span></span></div>
      <div id="costList"></div>
      <button class="add exp" id="addCost">＋ 項目を追加</button>
      <div class="line"><span class="k">経費合計</span><span class="val mono" id="cost">0円</span></div>
    </div>

    <div class="answers">
      <div class="ans sales">
        <div class="tag" id="tag1">利益率 30%</div>
        <div class="cap">この経費なら、売上はいくら必要？</div>
        <div class="big mono" id="needSales">―</div>
        <div class="sub" id="needUnit">経費を入れると必要な売上が出ます</div>
      </div>
      <div class="ans cost">
        <div class="tag" id="tag2">利益率 30%</div>
        <div class="cap">この売上なら、経費はいくらまで？</div>
        <div class="big mono" id="maxCost">―</div>
        <div class="sub" id="costDiff">参加費・人数を入れると上限が出ます</div>
      </div>
    </div>

    <div class="now">
      <div class="top">
        <span class="t">今の見込み</span>
        <span class="badge idle" id="badge">数字を入力してください</span>
      </div>
      <div class="stats">
        <div class="stat"><div class="k">利益額</div><div class="n mono" id="profit">―</div></div>
        <div class="stat"><div class="k">利益率</div><div class="n mono" id="margin">―</div></div>
      </div>
    </div>

    <div class="foot">入力した数字はこの端末の中だけで計算され、<br>どこにも送信・保存されません。</div>
  </div>
</div>

<script>
  const yen=n=>(n<0?"-":"")+Math.round(Math.abs(n)).toLocaleString("ja-JP")+"円";
  const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n;};
  const $=id=>document.getElementById(id);
  let target=0.30;

  let sales=[{name:"一般",price:"",qty:""}];
  let costs=[{name:"会場費",amt:""},{name:"講師謝礼",amt:""}];

  function renderSales(){
    const list=$("salesList");list.innerHTML="";
    sales.forEach((r,i)=>{
      const el=document.createElement("div");el.className="srow sale";
      el.innerHTML=`
        <input class="nm" value="${r.name}" placeholder="区分名" data-g="s" data-t="name" data-i="${i}">
        <input class="ipt" inputmode="numeric" value="${r.price}" placeholder="円" data-g="s" data-t="price" data-i="${i}">
        <input class="ipt" inputmode="numeric" value="${r.qty}" placeholder="人" data-g="s" data-t="qty" data-i="${i}">
        ${sales.length>1?`<button class="del" data-g="s" data-t="del" data-i="${i}">×</button>`:`<span></span>`}`;
      list.appendChild(el);
    });
  }
  function renderCosts(){
    const list=$("costList");list.innerHTML="";
    costs.forEach((r,i)=>{
      const el=document.createElement("div");el.className="srow exp";
      el.innerHTML=`
        <input class="nm" value="${r.name}" placeholder="項目名" data-g="c" data-t="name" data-i="${i}">
        <input class="ipt" inputmode="numeric" value="${r.amt}" placeholder="円" data-g="c" data-t="amt" data-i="${i}">
        ${costs.length>1?`<button class="del" data-g="c" data-t="del" data-i="${i}">×</button>`:`<span></span>`}`;
      list.appendChild(el);
    });
  }

  function calc(){
    const salesTotal=sales.reduce((s,r)=>s+num(r.price)*num(r.qty),0);
    const qty=sales.reduce((s,r)=>s+num(r.qty),0);
    const costTotal=costs.reduce((s,r)=>s+num(r.amt),0);
    const profit=salesTotal-costTotal;
    const margin=salesTotal>0?profit/salesTotal:0;
    const pctTxt=Math.round(target*100)+"%";

    $("sales").textContent=yen(salesTotal);
    $("qtyTotal").textContent=qty.toLocaleString("ja-JP")+"人";
    $("cost").textContent=yen(costTotal);
    $("tag1").textContent="利益率 "+pctTxt;
    $("tag2").textContent="利益率 "+pctTxt;

    if(costTotal>0 && target<1){
      const need=costTotal/(1-target);
      $("needSales").textContent=yen(need);
      $("needUnit").textContent = qty>0
        ? "今の人数なら 1人 "+yen(need/qty)+" が目安"
        : "人数を入れると1人あたりの単価が出ます";
    }else{
      $("needSales").textContent="―";
      $("needUnit").textContent="経費を入れると必要な売上が出ます";
    }

    if(salesTotal>0){
      const maxCost=salesTotal*(1-target);
      $("maxCost").textContent=yen(maxCost);
      const room=maxCost-costTotal;
      $("costDiff").textContent = costTotal>0
        ? (room>=0 ? "あと "+yen(room)+" まで使えます" : yen(-room)+" オーバーしています")
        : "この金額まで経費に使えます";
    }else{
      $("maxCost").textContent="―";
      $("costDiff").textContent="参加費・人数を入れると上限が出ます";
    }

    const badge=$("badge");
    if(salesTotal<=0&&costTotal<=0){
      badge.className="badge idle";badge.textContent="数字を入力してください";
      $("profit").textContent="―";$("margin").textContent="―";
    }else{
      $("profit").textContent=yen(profit);
      $("margin").textContent=salesTotal>0?(margin*100).toFixed(1)+"%":"―";
      if(salesTotal<=0){badge.className="badge idle";badge.textContent="売上を入力してください";}
      else if(margin>=target){badge.className="badge ok";badge.textContent="◎ 目標達成";}
      else{badge.className="badge no";badge.textContent="△ あと "+((target-margin)*100).toFixed(1)+"%";}
    }
  }

  document.body.addEventListener("input",e=>{
    const g=e.target.dataset.g,t=e.target.dataset.t,i=e.target.dataset.i;
    if(!g)return;
    if(g==="s"){
      if(t==="name")sales[i].name=e.target.value;
      else if(t==="price")sales[i].price=e.target.value;
      else if(t==="qty")sales[i].qty=e.target.value;
    }else{
      if(t==="name")costs[i].name=e.target.value;
      else if(t==="amt")costs[i].amt=e.target.value;
    }
    calc();
  });
  document.body.addEventListener("click",e=>{
    const g=e.target.dataset.g,t=e.target.dataset.t,i=e.target.dataset.i;
    if(t!=="del")return;
    if(g==="s"){sales.splice(i,1);renderSales();}
    else{costs.splice(i,1);renderCosts();}
    calc();
  });
  $("addSale").onclick=()=>{sales.push({name:"",price:"",qty:""});renderSales();calc();};
  $("addCost").onclick=()=>{costs.push({name:"",amt:""});renderCosts();calc();};

  function setT(v){target=Math.max(0,Math.min(0.9,Math.round(v*100)/100));$("tv").textContent=Math.round(target*100)+"%";calc();}
  $("up").onclick=()=>setT(target+0.05);
  $("down").onclick=()=>setT(target-0.05);

  renderSales();renderCosts();calc();
</script>
</body>
</html>
